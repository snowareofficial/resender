# 构建校验：三平台 × 两种 feature 形态
#
# 两种形态（见 Cargo.toml [features]）：
#   default（含 gui）     -> 完整桌面应用（Slint GUI + CLI）
#   --no-default-features -> 纯 CLI 二进制（不含 Slint 运行时）
#
# 关键点：
# - **path 依赖**：swi18n / swsml 以 path 引用仓库外的 ../swi18n 与 ../sml/rust，
#   Actions 里 checkout 后这些路径不存在，必须先 clone 到对应位置，否则 cargo 直接报错。
#   （同时写了 version，本地开发用 path、发布用 crates.io；CI 走 path。）
# - **字体**：ui/MiSans VF.ttf（19 MiB）随仓库分发，build.rs 检测到即内嵌；
#   缺失时会回退系统字体，构建同样成功，因此这里不做额外处理。
name: 构建

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # gui   = 完整桌面应用（默认）
        # cli   = 纯 CLI（--no-default-features）
        profile: [gui, cli]
      #
      # 额度说明：若仓库是私有的，Actions 计费倍率为 Linux ×1 / Windows ×2 /
      # **macOS ×10**，免费额度 2000 分钟/月。此时可用 matrix.exclude 在 PR 时
      # 排除高倍率平台，例如：
      #     exclude:
      #       - os: windows-latest
      #         profile: ${{ 'x' }}        # 条件排除需用静态值或 step 级 if
      #
      # **切勿写成 job 级 `if: github.event_name != 'pull_request' || matrix.os == ...`**：
      # job 级 if 求值时矩阵尚未展开，GitHub 会报
      #   "Unrecognized named-value: 'matrix'"
      # 并使整个 workflow 变成无效文件（表现为 jobs=0、0 秒失败，且不触发任何构建）。
      # 本仓库已设为公开（免费额度不限），故跑完整矩阵。

    steps:
      - uses: actions/checkout@v4

      - name: 拉取 path 依赖（swi18n / swsml）
        shell: bash
        run: |
          set -euo pipefail
          # 与 Cargo.toml 中的 path 保持一致：../swi18n 与 ../sml/rust
          git clone --depth 1 https://gitee.com/snoware/swi18n.git ../swi18n
          git clone --depth 1 https://gitee.com/snoware/sml.git ../sml
          ls ../swi18n/Cargo.toml ../sml/rust/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖（Slint 需要字体与窗口系统库）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfontconfig1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: 获取界面字体（官方源按需下载）
        shell: bash
        run: |
          # 官方包整包 217 MB，fetch_font.py 只取需要的那一项（约 13.7 MB）。
          # 字体缺失时 build.rs 回退系统字体，构建仍能通过，故此处不设 -e 中断。
          python tools/fetch_font.py || echo "字体获取失败，本次构建回退系统字体"

      - name: 构建
        shell: bash
        run: |
          if [ "${{ matrix.profile }}" = "cli" ]; then
            cargo build --release --no-default-features
          else
            cargo build --release
          fi

      - name: 校验两种形态（仅 gui 组合，避免重复）
        if: matrix.profile == 'gui'
        shell: bash
        run: python tools/check_builds.py

      - name: CLI 自检（纯 CLI 组合）
        if: matrix.profile == 'cli'
        shell: bash
        run: |
          BIN=target/release/resender
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" version
          "$BIN" help

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: resender-${{ matrix.os }}-${{ matrix.profile }}
          path: |
            target/release/resender
            target/release/resender.exe
          if-no-files-found: ignore
          retention-days: 7
