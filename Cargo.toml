[package]
name = "resender"
version = "0.1.0"
edition = "2021"
authors = ["S.A. <https://snoware.dev>"]
license = "MulanPubL-2.0"
description = "SWE::Resender — Rhai 驱动的 Resend 发信工具（Slint GUI）"

[dependencies]
slint = "1.8"
libsmx = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"
rand = "0.8"
base64 = "0.22"
rhai = { version = "1.18", features = ["sync", "serde"] }
once_cell = "1"
rfd = "0.15"
# Markdown → 邮件友好 HTML
# comrak 关掉默认 feature（默认含 cli + syntect 语法高亮，会显著拖慢编译且本项目不需要）
comrak = { version = "0.54", default-features = false }
css-inline = { version = "0.21", default-features = false }

[build-dependencies]
slint-build = "1.8"
